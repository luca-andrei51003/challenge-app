<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Counter App GitOps 2.0</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        #counter {
            font-size: 5rem;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="counter">0</div>

    <script>
        let count = 0;
        const counterElement = document.getElementById('counter');
        
        setInterval(() => {
            count++;
            counterElement.textContent = count;
        }, 1000);
    </script>
</body>
</html>
