apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: challenge-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/luca-andrei51003/challenge-app.git'
    targetRevision: HEAD

    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true