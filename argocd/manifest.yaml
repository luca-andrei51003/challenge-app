apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: challenge-app
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: app=culceanluca/py-web
    argocd-image-updater.argoproj.io/app.update-strategy: latest
spec:
  project: default
  source:
    repoURL: 'https://github.com/luca-andrei51003/challenge-app.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true