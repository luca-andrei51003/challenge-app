name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 1. Build & Push using unique Git SHA tag
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            culceanluca/py-web:${{ github.sha }}
            culceanluca/py-web:latest

      # 2. Update Kubernetes Manifests in Git
      - name: Update Kubernetes Manifest Tag
        run: |
          sed -i 's|image: culceanluca/py-web:.*|image: culceanluca/py-web:${{ github.sha }}|g' k8s/deployment.yaml

      # 3. Commit and Push back to Git to trigger Argo CD
      - name: Commit Manifest Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): update challenge-app image tag to ${{ github.sha }} [skip ci]"
          git push